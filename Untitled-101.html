<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <title>Notes App in JavaScript</title>
    <link rel="stylesheet" href="NOTES APP CSS.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
</head>
<body>
    <div class="app-container">
    <div class="popup-box">
        <div class="popup">
            <div class="content">
                <header>
                    <form action="#">
                        <div class="role title">
                            <label>Title</label>
                            <input type="text" spellcheck="false">
                        </div>
                        <div class="row description">
                            <label>Description</label>
                            <textarea spellcheck="false"></textarea>
                        </div>
                        <button></button>
                    </form>
                </div>
        </div>
    </div>
    <div class="wrapper">
        <li class="add-box">
            <div class="icon"><i class="uil uil-plus"></i></div>
            <p>Add new note</p>
        </li>
    </div>
    <footer class="footer">
        <p>Made by <a href="https://mkostech.me" target="_blank" class="footer-link">Makos tech</a></p>
    </footer>
    </div>
    <script src="NOTES APP JAVA.js"></script>
</body>
</html>
